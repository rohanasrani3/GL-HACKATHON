[project]
name = "osagent"
version = "0.1.0"
description = "Record a GUI task once, compile it to a deterministic replayable program, verify the result."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "mss>=9.0",
    "pillow>=10.3",
    "pyautogui>=0.9.54",
    "pynput>=1.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    # --- platform specific ---
    "uiautomation>=2.0.18 ; sys_platform == 'win32'",
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "pyobjc-framework-ApplicationServices>=10.3 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3 ; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3 ; sys_platform == 'darwin'",
]

[project.scripts]
osagent = "osagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osagent"]
