# osagent configuration. Environment variables always win over this file.
model:
  provider: ollama            # ollama | openai_compat
  name: gemma4                # OSAGENT_MODEL
  base_url: http://localhost:11434
  temperature: 0.0
  think: false                # gemma4 is a reasoning model; see OllamaClient
  max_tokens: 300             # hard cap on the reply; see OllamaClient for why
  timeout_s: 300           # a 12B model on CPU can take minutes on a long prompt

paths:
  recordings: recordings
  workflows: workflows
  runs: runs

perception:
  max_elements: 400           # hard cap on a single snapshot, keeps prompts small
  max_depth: 18               # a11y tree walk depth
  ignore_offscreen: true

matching:
  fuzzy_threshold: 82         # rapidfuzz score needed for a name match
  accept_threshold: 0.55      # overall score needed to act on a candidate

run:
  step_timeout_ms: 8000
  settle_ms: 250              # pause after each action before the next snapshot
  screenshot_every_step: true

safety:
  destructive_keywords: [send, submit, delete, pay, purchase, transfer, remove, publish]
  abort_key: esc
  # A live agent may only start these. Anything else is refused, not confirmed.
  allowed_apps: [notepad, calc, calculator, mspaint, paint, explorer, wordpad,
                 chrome, msedge, firefox, code, excel, winword, notepad++]

agent:
  max_steps: 14               # hard cap on one live agent run
  elements_in_prompt: 70      # how much of the UI tree the model sees per turn
  settle_ms: 600              # pause after an action before re-perceiving
  move_duration_s: 0.35       # visible cursor travel, so a human can follow along

ui:
  port: 8765
